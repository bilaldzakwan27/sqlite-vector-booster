name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            library: libsqlite_vector_booster.so
          - os: macos-15-intel
            target: x86_64-apple-darwin
            library: libsqlite_vector_booster.dylib
          - os: macos-15
            target: aarch64-apple-darwin
            library: libsqlite_vector_booster.dylib
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            library: sqlite_vector_booster.dll
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      SQLITE_VECTOR_BOOSTER_LIBRARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ matrix.library }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select extension-enabled Python on macOS
        if: runner.os == 'macOS'
        run: |
          brew install --skip-link python@3.12
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv "$RUNNER_TEMP/sqlite-booster-python"
          "$RUNNER_TEMP/sqlite-booster-python/bin/python" -c 'import sqlite3; assert hasattr(sqlite3.Connection, "enable_load_extension")'
          echo "$RUNNER_TEMP/sqlite-booster-python/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustup target add "$CARGO_BUILD_TARGET" --toolchain "$toolchain"
      - name: Check formatting and lints
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Compile release and run Rust tests
        run: |
          cargo build --release --locked
          cargo test --release --locked
      - name: Validate SQLite ABI and SQL behavior
        run: python tests/integration.py
      - name: Verify SQLite CLI end to end
        if: runner.os == 'Linux'
        run: |
          if ! command -v sqlite3 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y sqlite3
          fi
          python tests/cli.py
      - name: Check installation and UAT regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run accuracy, boundary, performance, and memory QA
        id: qa
        run: |
          python -m pip install --disable-pip-version-check -r requirements-qa.txt
          python -m pytest qa_suite.py -q -o junit_family=legacy --junitxml=qa-results/results.xml
      - name: Upload QA report
        if: always() && steps.qa.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.target }}
          path: qa-results/results.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Build and verify Python wheel
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          for wheel in dist/*.whl; do python verify_wheel.py "$wheel"; done
          python -m pip install --no-index --find-links dist sqlite-vector-booster
          python tests/python_package.py
          python example.py
      - name: Verify npm package and Node integration
        run: |
          node scripts/build-node.cjs
          npm install --no-save --package-lock=false better-sqlite3
          npm test
          npm pack --pack-destination dist
      - name: Package native library
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            python scripts/package_release.py --target "$CARGO_BUILD_TARGET" --tag "$RELEASE_TAG"
          else
            python scripts/package_release.py --target "$CARGO_BUILD_TARGET"
          fi
      - name: Record Linux benchmarks
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo bench --locked --bench distance > dist/benchmark-kernels.csv
          python benchmarks/sqlite.py > dist/benchmark-sqlite.json
          rustc -vV > dist/benchmark-environment.txt
          lscpu >> dist/benchmark-environment.txt
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
